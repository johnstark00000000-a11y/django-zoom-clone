<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Meeting - {{ room_name }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Navigation */
        .header {
            height: 48px;
            background-color: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #282828;
        }

        .room-info {
            font-size: 14px;
            font-weight: 600;
            color: #0e71eb;
        }

        /* Main Screen Layout */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* Dynamic Zoom Video Grid */
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            padding: 20px;
            align-content: center;
            justify-content: center;
            overflow-y: auto;
        }

        .video-card {
            position: relative;
            background-color: #242424;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            border: 2px solid #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-card .avatar {
            width: 80px;
            height: 80px;
            background-color: #0e71eb;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .video-card.video-off video {
            display: none;
        }

        .video-card.video-off .avatar {
            display: flex;
        }

        .user-tag {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Right Sidebar Panel */
        .sidebar {
            width: 340px;
            background-color: #222222;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .sidebar.hidden {
            display: none;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #333;
            background-color: #1a1a1a;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom: 2px solid #0e71eb;
        }

        .panel-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2e2e2e;
            font-size: 14px;
        }

        /* In-Meeting Chat */
        .chat-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            background-color: #2d2d2d;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            max-width: 85%;
        }

        .msg.me {
            background-color: #0e71eb;
            align-self: flex-end;
        }

        .msg-input {
            display: flex;
            gap: 8px;
        }

        .msg-input input {
            flex: 1;
            padding: 10px;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        /* Bottom Control Bar */
        .controls {
            height: 72px;
            background-color: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border-top: 1px solid #282828;
        }

        .ctrl-btn {
            background-color: #242424;
            border: 1px solid #333;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 75px;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            background-color: #333333;
        }

        .ctrl-btn.off {
            background-color: #e02828;
            border-color: #e02828;
        }

        .btn-leave {
            background-color: #e02828;
            border: none;
            font-weight: 600;
        }

        .btn-leave:hover {
            background-color: #c01e1e;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="room-info">📁 Room: {{ room_name }}</div>
        <div>Participant: <b style="color: #0e71eb;">{{ username }}</b></div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        
        <!-- Video Grid -->
        <div class="video-grid" id="video-grid">
            <div class="video-card" id="local-card">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="avatar" id="local-avatar">{{ username|slice:":1"|upper }}</div>
                <div class="user-tag">
                    <span id="mic-icon">🎤</span> {{ username }} (You)
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" id="tab-members" onclick="switchTab('members')">Participants (1)</button>
                <button class="tab-btn" id="tab-chat" onclick="switchTab('chat')">Chat</button>
            </div>

            <!-- Participants -->
            <div id="members-panel" class="panel-content">
                <div class="member-item">
                    <span>{{ username }} (Host)</span>
                    <small style="color: #0e71eb;">Active</small>
                </div>
            </div>

            <!-- Chat -->
            <div id="chat-panel" class="panel-content" style="display: none;">
                <div class="chat-box">
                    <div class="messages" id="chat-messages">
                        <div class="msg">Meeting started. Share the room ID to invite others!</div>
                    </div>
                    <div class="msg-input">
                        <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                        <button class="ctrl-btn" onclick="sendMsg()" style="min-width: auto; padding: 10px 14px;">Send</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <button class="ctrl-btn" id="mic-btn" onclick="toggleAudio()">
            <span>🎤</span>
            <span id="mic-label">Mute</span>
        </button>
        <button class="ctrl-btn" id="cam-btn" onclick="toggleVideo()">
            <span>📹</span>
            <span id="cam-label">Stop Video</span>
        </button>
        <button class="ctrl-btn" onclick="shareScreen()">
            <span>🖥️</span>
            <span>Share Screen</span>
        </button>
        <button class="ctrl-btn" onclick="toggleSidebar()">
            <span>👥</span>
            <span>Participants</span>
        </button>
        <button class="ctrl-btn btn-leave" onclick="leaveRoom()">
            <span>🚪</span>
            <span>End Call</span>
        </button>
    </div>

    <script>
        let localStream = null;
        let isAudioMuted = false;
        let isVideoOff = false;

        // Camera & Mic Initialization
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.warn("Camera/Mic access denied or missing:", err);
            }
        }
        initCamera();

        // Audio Mute/Unmute
        function toggleAudio() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isAudioMuted = !isAudioMuted;
                audioTrack.enabled = !isAudioMuted;
                
                const btn = document.getElementById('mic-btn');
                const label = document.getElementById('mic-label');
                const icon = document.getElementById('mic-icon');

                if (isAudioMuted) {
                    btn.classList.add('off');
                    label.innerText = 'Unmute';
                    icon.innerText = '🔇';
                } else {
                    btn.classList.remove('off');
                    label.innerText = 'Mute';
                    icon.innerText = '🎤';
                }
            }
        }

        // Video On/Off Toggle
        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                isVideoOff = !isVideoOff;
                videoTrack.enabled = !isVideoOff;

                const card = document.getElementById('local-card');
                const btn = document.getElementById('cam-btn');
                const label = document.getElementById('cam-label');

                if (isVideoOff) {
                    card.classList.add('video-off');
                    btn.classList.add('off');
                    label.innerText = 'Start Video';
                } else {
                    card.classList.remove('video-off');
                    btn.classList.remove('off');
                    label.innerText = 'Stop Video';
                }
            }
        }

        // Native Screen Sharing
        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('local-video').srcObject = screenStream;
                screenStream.getVideoTracks()[0].onended = () => {
                    document.getElementById('local-video').srcObject = localStream;
                };
            } catch (err) {
                console.log("Screen share cancelled:", err);
            }
        }

        // Panel Toggle Logic
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function switchTab(tab) {
            document.getElementById('tab-members').classList.toggle('active', tab === 'members');
            document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');

            document.getElementById('members-panel').style.display = tab === 'members' ? 'flex' : 'none';
            document.getElementById('chat-panel').style.display = tab === 'chat' ? 'flex' : 'none';
        }

        // Chat System
        function sendMsg() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (txt) {
                const box = document.getElementById('chat-messages');
                box.innerHTML += `<div class="msg me"><b>You:</b> ${txt}</div>`;
                input.value = '';
                box.scrollTop = box.scrollHeight;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMsg();
        }

        function leaveRoom() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
