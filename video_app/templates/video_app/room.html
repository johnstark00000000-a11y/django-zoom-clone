<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Room - {{ room_name }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Mode Selection Overlay Card */
        .role-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .role-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .role-card h2 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #fff;
        }

        .role-card p {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .role-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #242424;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-select:hover {
            background: #2d2d2d;
        }

        .btn-select.host {
            background: #0e71eb;
            border-color: #0e71eb;
        }

        .btn-select.host:hover {
            background: #0c62ce;
        }

        /* Top Header Bar */
        .header {
            height: 52px;
            background-color: #141414;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #262626;
        }

        .meeting-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge-role {
            background-color: #333;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .badge-role.is-host {
            background-color: #0e71eb;
        }

        .invite-btn {
            background: #242424;
            border: 1px solid #3a3a3a;
            color: #2b82fb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Workspace & Video Grid */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            padding: 12px;
            align-content: center;
            justify-content: center;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
                padding: 8px;
                gap: 8px;
            }
        }

        .video-card {
            position: relative;
            background-color: #1f1f1f;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 2px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: #0e71eb;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .video-card.off video { display: none; }
        .video-card.off .avatar { display: flex; }

        .user-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            backdrop-filter: blur(4px);
        }

        /* Right Panel Sidebar */
        .sidebar {
            width: 320px;
            background-color: #181818;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute; right: 0; top: 0; bottom: 0;
                width: 100%; max-width: 340px;
                box-shadow: -5px 0 20px rgba(0,0,0,0.8);
            }
        }

        .sidebar.hidden { display: none; }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
            background: #121212;
        }

        .tab-btn {
            flex: 1; padding: 12px;
            background: none; border: none;
            color: #888; font-weight: bold; font-size: 13px;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #fff; border-bottom: 2px solid #0e71eb;
        }

        .panel-body {
            flex: 1; padding: 12px;
            overflow-y: auto; display: flex;
            flex-direction: column;
        }

        .host-box {
            background: #222; border: 1px solid #333;
            border-radius: 8px; padding: 10px; margin-bottom: 12px;
        }

        .host-actions { display: flex; gap: 6px; }

        .host-btn {
            flex: 1; background: #2a2a2a; border: 1px solid #444;
            color: #fff; padding: 6px 8px; font-size: 11px;
            border-radius: 4px; cursor: pointer;
        }

        /* Bottom Toolbar */
        .controls {
            height: 68px; background-color: #121212;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; border-top: 1px solid #262626; padding: 0 10px;
        }

        .ctrl-btn {
            background-color: #222; border: 1px solid #333;
            color: white; padding: 6px 12px; border-radius: 8px;
            cursor: pointer; font-size: 11px; display: flex;
            flex-direction: column; align-items: center; gap: 3px; min-width: 62px;
        }

        .ctrl-btn.off { background-color: #e02828; border-color: #e02828; }
        .btn-end { background-color: #e02828; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Join/Host Selection Modal Overlay -->
    <div class="role-overlay" id="role-overlay">
        <div class="role-card">
            <h2>Meeting: {{ room_name }}</h2>
            <p>Aap meeting me kaise enter hona chahte hain?</p>
            <div class="role-btn-group">
                <button class="btn-select host" onclick="selectRole('host')">
                    👑 Host (Create & Admin Powers)
                </button>
                <button class="btn-select" onclick="selectRole('guest')">
                    👤 Guest (Join as Participant)
                </button>
            </div>
        </div>
    </div>

    <!-- Top Header -->
    <div class="header">
        <div class="meeting-title">
            <span>ID: {{ room_name }}</span>
            <span class="badge-role" id="role-badge">Guest</span>
        </div>
        <button class="invite-btn" onclick="copyMeetingLink()">🔗 Copy Link</button>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        <!-- Video Grid -->
        <div class="video-grid" id="video-grid">
            <div class="video-card" id="local-card">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="avatar" id="local-avatar">{{ username|slice:":1"|upper }}</div>
                <div class="user-tag">🎤 {{ username }} (You)</div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" id="tab-members" onclick="switchTab('members')">Participants (1)</button>
                <button class="tab-btn" id="tab-chat" onclick="switchTab('chat')">Chat</button>
            </div>

            <div id="members-panel" class="panel-body">
                <!-- Host Panel (Only Visible to Host) -->
                <div class="host-box" id="host-powers" style="display: none;">
                    <h4 style="font-size:11px; color:#0e71eb; margin-bottom:8px;">👑 HOST CONTROL PANEL</h4>
                    <div class="host-actions">
                        <button class="host-btn" onclick="muteAll()">Mute All</button>
                        <button class="host-btn" onclick="lockRoom()">Lock Room</button>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid #222;">
                    <span>{{ username }} (You)</span>
                    <small id="user-role-lbl" style="color: #0e71eb;">Participant</small>
                </div>
            </div>

            <div id="chat-panel" class="panel-body" style="display: none;">
                <div style="flex:1; overflow-y:auto;" id="chat-box">
                    <p style="font-size:12px; color:#777;">Live Chat Section</p>
                </div>
                <div style="display:flex; gap:6px; margin-top:10px;">
                    <input type="text" id="chat-input" placeholder="Type msg..." style="flex:1; padding:8px; background:#222; border:1px solid #333; color:#fff; border-radius:4px;">
                    <button onclick="sendChat()" class="host-btn" style="width: auto;">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <button class="ctrl-btn" id="mic-btn" onclick="toggleAudio()">
            <span>🎤</span><span id="mic-lbl">Mute</span>
        </button>
        <button class="ctrl-btn" id="cam-btn" onclick="toggleVideo()">
            <span>📹</span><span id="cam-lbl">Stop</span>
        </button>
        <button class="ctrl-btn" onclick="shareScreen()">
            <span>🖥️</span><span>Share</span>
        </button>
        <button class="ctrl-btn" onclick="toggleSidebar()">
            <span>👥</span><span>Members</span>
        </button>
        <button class="ctrl-btn btn-end" onclick="leaveMeeting()">
            <span>🚪</span><span>Leave</span>
        </button>
    </div>

    <script>
        let localStream;
        let isMuted = false, isCamOff = false;
        let currentRole = 'guest';

        function selectRole(role) {
            currentRole = role;
            document.getElementById('role-overlay').style.display = 'none';
            
            const badge = document.getElementById('role-badge');
            const roleLbl = document.getElementById('user-role-lbl');
            const hostPowers = document.getElementById('host-powers');

            if (role === 'host') {
                badge.innerText = 'Host';
                badge.classList.add('is-host');
                roleLbl.innerText = 'Host';
                hostPowers.style.display = 'block';
            } else {
                badge.innerText = 'Guest';
                badge.classList.remove('is-host');
                roleLbl.innerText = 'Guest';
                hostPowers.style.display = 'none';
            }
            startMedia();
        }

        async function startMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.log("Media error:", err);
            }
        }

        function copyMeetingLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Meeting Link Copied:\n" + window.location.href);
        }

        function muteAll() { alert("Host Power: Muted all participants."); }
        function lockRoom() { alert("Host Power: Room locked."); }

        function toggleAudio() {
            if(!localStream) return;
            const track = localStream.getAudioTracks()[0];
            if(track) {
                isMuted = !isMuted;
                track.enabled = !isMuted;
                document.getElementById('mic-btn').classList.toggle('off', isMuted);
                document.getElementById('mic-lbl').innerText = isMuted ? 'Unmute' : 'Mute';
            }
        }

        function toggleVideo() {
            if(!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if(track) {
                isCamOff = !isCamOff;
                track.enabled = !isCamOff;
                document.getElementById('local-card').classList.toggle('off', isCamOff);
                document.getElementById('cam-btn').classList.toggle('off', isCamOff);
                document.getElementById('cam-lbl').innerText = isCamOff ? 'Start' : 'Stop';
            }
        }

        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('local-video').srcObject = screenStream;
                screenStream.getVideoTracks()[0].onended = () => {
                    document.getElementById('local-video').srcObject = localStream;
                };
            } catch(e) {}
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }

        function switchTab(t) {
            document.getElementById('tab-members').classList.toggle('active', t==='members');
            document.getElementById('tab-chat').classList.toggle('active', t==='chat');
            document.getElementById('members-panel').style.display = t==='members' ? 'flex' : 'none';
            document.getElementById('chat-panel').style.display = t==='chat' ? 'flex' : 'none';
        }

        function sendChat() {
            const inp = document.getElementById('chat-input');
            if(inp.value.trim()) {
                document.getElementById('chat-box').innerHTML += `<p style="font-size:13px; margin-top:6px;"><b>You:</b> ${inp.value}</p>`;
                inp.value = '';
            }
        }

        function leaveMeeting() { window.location.href = '/'; }
    </script>
</body>
</html>
