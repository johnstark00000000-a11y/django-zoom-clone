<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Meeting Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- ZegoUIKit Prebuilt SDK -->
    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt@latest/zego-uikit-prebuilt.js"></script>

    <script>
        window.onload = function () {
            // Django template variables
            const roomID = "{{ room_name }}";
            const userName = "{{ username }}" || "User_" + Math.floor(Math.random() * 1000);
            const userID = "user_" + Math.floor(Math.random() * 100000);

            // Free Test Credentials (ZegoCloud)
            const appID = 1248455234;
            const serverSecret = "61765c928420e6a3949826d70a1a0178";

            // Generate Token
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
                appID, 
                serverSecret, 
                roomID, 
                userID, 
                userName
            );

            // Create UI Instance
            const zp = ZegoUIKitPrebuilt.create(kitToken);

            // Join Room with all Zoom features enabled
            zp.joinRoom({
                container: document.getElementById('root'),
                sharedLinks: [
                    {
                        name: 'Meeting Link',
                        url: window.location.protocol + '//' + window.location.host + window.location.pathname,
                    },
                ],
                scenario: {
                    mode: ZegoUIKitPrebuilt.GroupCall, // Grid layout like Zoom
                },
                showPrejoinView: true,             // Direct join hone se pehle Name/Mic check screen
                showScreenSharingButton: true,      // Screen Share option
                showUserList: true,                 // Member/Participants Sidebar
                showChat: true,                     // Live Meeting Chat
                showLeaveRoomConfirmDialog: true,   // Exit confirmation
                maxUsers: 50,                       // Support up to 50 users
                layout: "Auto",                     // Auto dynamic video grid
                lowerLeftNotification: {
                    showUserJoinAndLeave: true,     // User enter/leave pop-up alerts
                }
            });
        };
    </script>
</body>
</html>
