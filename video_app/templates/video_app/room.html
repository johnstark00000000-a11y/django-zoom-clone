<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Meeting Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111;
        }
        #jitsi-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="jitsi-container"></div>

    <!-- Free Open-Source Jitsi Meet External API (No API Key Required) -->
    <script src="https://meet.jit.si/external_api.js"></script>

    <script>
        window.onload = function () {
            const domain = "meet.jit.si";
            
            // Unique Room Name for Django
            const roomName = "DjangoZoomRoom_" + "{{ room_name }}";
            
            const options = {
                roomName: roomName,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: {
                    displayName: "{{ username }}" || "Guest User"
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    prejoinPageEnabled: true, // Guest Name & Camera Test Preview
                    disableDeepLinking: true,  // Web browser me hi chalega
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'desktop', 'chat', 
                        'raisehand', 'participants-pane', 'tileview', 
                        'toggle-camera', 'fullscreen', 'hangup'
                    ],
                }
            };

            const api = new JitsiMeetExternalAPI(domain, options);

            // Call disconnect hone par home page par redirect karega
            api.addEventListeners({
                videoConferenceLeft: function () {
                    window.location.href = "/";
                }
            });
        };
    </script>
</body>
</html>
